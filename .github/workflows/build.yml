name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libffi-dev libssl-dev libltdl-dev

      - name: Cache SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==3.0.11

      # Анти-504: заранее скачиваем архив Python в папку пакетов buildozer,
      # чтобы p4a не качал его с python.org во время сборки.
      - name: Pre-download Python sources (anti-504)
        run: |
          mkdir -p ~/.buildozer/android/packages/downloads
          for i in 1 2 3 4 5; do
            curl -L --fail --retry 10 --retry-delay 15 \
              -o ~/.buildozer/android/packages/downloads/Python-3.11.11.tgz \
              https://www.python.org/ftp/python/3.11.11/Python-3.11.11.tgz && break
            echo "Попытка $i не удалась, жду 30 секунд..."
            sleep 30
          done

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: videolooper-apk
          path: bin/*.apk


